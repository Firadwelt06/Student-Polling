{% extends "base.html" %}
{% block title %}Ballot submitted | {{ school_name }}{% endblock %}
{% block content %}
<section class="form-page">
  <div class="form-card success-card">
    <span class="success-icon">✓</span>
    <span class="eyebrow">BALLOT RECEIVED</span>
    <h1>Thank you for participating.</h1>
    <p class="muted">Your anonymous ballot has been recorded.</p>
    <a class="button button-secondary" href="{{ url_for('index') }}">Return home</a>
  </div>
</section>
{% endblock %}
